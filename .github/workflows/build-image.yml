name: build-image

# Builda a imagem do motor de voz e publica no Docker Hub.
# Dispara: push na main (inclui os merges do upstream Astra) + manual.
#
# Pré-requisito (Settings > Secrets and variables > Actions do fork):
#   DOCKERHUB_USERNAME  = marconebarreto
#   DOCKERHUB_TOKEN     = token do Docker Hub (Account > Security > New Access Token)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            marconebarreto/agxone-voice:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
